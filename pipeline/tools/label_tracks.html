<!doctype html><meta charset="utf-8"><title>CityTrace blind track labeller</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;background:#f4f7fa;color:#173344}article{background:white;padding:20px;margin:18px 0;border-radius:10px}img{max-width:300px;max-height:240px}label{display:block;margin:10px}input,select,button{padding:9px}</style><h1>Blind track labelling</h1><p>No model plate predictions are shown. Label only readable plates. Input footage must be owned or consented. Crops remain local and are deleted when the server exits.</p><label>Labeller<input id="labeller" required></label><main></main><button id="export">Export CSV</button><script>
const records=__RECORDS__,fields=['plate','readable','condition','plate_height_px','second_labeller','second_plate'];const main=document.querySelector('main');records.forEach((r,i)=>{const el=document.createElement('article');el.innerHTML=`<h2>${r.clip_id} / Track ${r.track_id}</h2><img src="${r.image}" alt="Vehicle crop for blind labelling">`+fields.map(f=>`<label>${f}${f==='readable'?'<select data-field="readable"><option>false</option><option>true</option></select>':`<input data-field="${f}" ${f==='plate_height_px'?'type="number" min="0"':''}>`}</label>`).join('');main.append(el);});document.querySelector('#export').onclick=()=>{const columns=['clip_id','track_id','plate','readable','condition','vehicle_class','labeller','labelled_at','plate_height_px','second_labeller','second_plate'];const quote=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=records.map((r,i)=>{const result={...r,labeller:document.querySelector('#labeller').value,labelled_at:new Date().toISOString()};main.children[i].querySelectorAll('[data-field]').forEach(e=>result[e.dataset.field]=e.value);return columns.map(k=>quote(result[k])).join(',');});const url=URL.createObjectURL(new Blob([columns.join(',')+'\n'+rows.join('\n')],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='blind-labels.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script>
